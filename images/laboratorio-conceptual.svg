<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Laboratorio conceptual de análisis de parches</title><desc id="desc">Código propio compilado en una VM. Los mismos binarios se analizan en Ghidra y en IDA con Diaphora. No existe conexión directa entre las herramientas.</desc><rect width="1100" height="560" fill="#0f172a"/><g font-family="Arial,sans-serif" fill="#f8fafc"><text x="40" y="48" font-size="28">Laboratorio local de patch diffing</text><text x="40" y="80" font-size="17" fill="#fbbf24">ESQUEMA CONCEPTUAL · No es una captura ni evidencia de ejecución</text><rect x="35" y="110" width="1030" height="365" rx="20" fill="#1e293b" stroke="#38bdf8"/><text x="60" y="147" font-size="20">VM de análisis · archivos propios · entorno controlado</text><rect x="65" y="185" width="260" height="105" rx="12" fill="#334155"/><text x="85" y="218" font-size="20">Repositorio local</text><text x="85" y="248" font-size="17">vulnerable.c / fixed.c</text><text x="85" y="273" font-size="17">Compilación y hashes</text><path d="M325 237 H405 M405 237 L393 230 M405 237 L393 244" stroke="#38bdf8" stroke-width="3" fill="none"/><rect x="415" y="185" width="260" height="105" rx="12" fill="#334155"/><text x="435" y="218" font-size="20">Dos binarios locales</text><text x="435" y="248" font-size="17">Mismas condiciones</text><text x="435" y="273" font-size="17">de compilación</text><path d="M675 237 H715 V205 H755 M715 237 V350 H755" stroke="#38bdf8" stroke-width="3" fill="none"/><rect x="765" y="170" width="270" height="100" rx="12" fill="#075985"/><text x="785" y="205" font-size="22">Ghidra</text><text x="785" y="237" font-size="16">Análisis estático independiente</text><rect x="765" y="305" width="270" height="100" rx="12" fill="#5b21b6"/><text x="785" y="340" font-size="22">IDA + Diaphora</text><text x="785" y="372" font-size="16">Exportar y comparar SQLite</text><text x="65" y="445" font-size="17">Salida prevista: capturas propias, registros, interpretación y límites del análisis.</text><text x="40" y="515" font-size="17">Versiones exactas y compatibilidad: pendientes de registrar en el entorno real.</text><text x="40" y="543" font-size="15" fill="#94a3b8">Ilustración original del proyecto · Sin interacción con objetivos externos</text></g></svg>
